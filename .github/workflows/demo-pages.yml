name: Deploy Shared Blueprint Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/demo-pages.yml'
      - 'apps/blueprint-demo-static/**'
      - 'apps/web/public/**'
      - 'apps/web/vite.config.ts'
      - 'examples/web-blueprint-demo/cordis.yml'
      - 'package.json'
      - 'packages/bundle/shared-blueprint/src/client/**'
      - 'packages/client/connection/src/client/blueprint-demo-events.ts'
      - 'packages/client/connection/src/client/fixture.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/build-blueprint-demo-static.ts'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static Demo
        env:
          DSH_BLUEPRINT_DEMO_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run demo:blueprint:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/dsh-creator-shared-blueprint

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
