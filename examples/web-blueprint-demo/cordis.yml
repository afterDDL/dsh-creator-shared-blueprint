# Opt-in Blueprint preview over the shipped Web composition. The installed
# shared-blueprint Host injects this caller-owned data before the normal browser
# graph starts; it does not replace the shell, theme, components, or slots.

- id: webserver
  config:
    host: 127.0.0.1
    port: 3082

- id: shared-blueprint
